# Experiment 10: VLM Ensemble — Multiclass (6 generators)
# Concatenates CLIP (512) + DINOv2 (1024) + SigLIP (1152) = 2688-dim features

experiment_name: "10_vlm_ensemble_multiclass"
description: "CLIP + DINOv2 + SigLIP concatenated features + classifier sweep (multiclass)"

task: "multiclass"

model:
  num_classes: 6

# VLM-specific config: all three models concatenated
vlm:
  models: ["clip-vit-b32", "dinov2-l", "siglip-so400m"]

classifiers:
  logistic_regression:
    enabled: true
    C: [0.01, 0.1, 1.0, 10.0, 100.0]

  random_forest:
    enabled: true
    n_estimators: [100, 300]
    max_depth: [null, 10, 20]

  xgboost:
    enabled: true
    n_estimators: [100, 300]
    max_depth: [3, 6]
    learning_rate: [0.1, 0.05]

  svm:
    enabled: true
    C: [0.1, 1.0, 10.0]

  mlp:
    enabled: true
    hidden_dims: [[1024, 512], [2048, 1024, 512], [2048, 1024]]
    dropout: 0.3
    lr: 0.001
    num_epochs: 50
    batch_size: 512
