# Experiment 08: DINOv2-Large — Multiclass (6 generators)

experiment_name: "08_dinov2_multiclass"
description: "DINOv2-L frozen features + classifier sweep (multiclass)"

task: "multiclass"

model:
  num_classes: 6
  vlm_backbone: "dinov2-l"

# VLM-specific config
vlm:
  models: ["dinov2-l"]

classifiers:
  logistic_regression:
    enabled: true
    C: [0.01, 0.1, 1.0, 10.0, 100.0]

  random_forest:
    enabled: true
    n_estimators: [100, 300]
    max_depth: [null, 10, 20]

  xgboost:
    enabled: true
    n_estimators: [100, 300]
    max_depth: [3, 6]
    learning_rate: [0.1, 0.05]

  svm:
    enabled: true
    C: [0.1, 1.0, 10.0]

  mlp:
    enabled: true
    hidden_dims: [[512], [1024, 512], [1024, 512, 256]]
    dropout: 0.3
    lr: 0.001
    num_epochs: 30
    batch_size: 512
