# Experiment 16: ViT-B/16 Binary — pretrained (ImageNet-21k)
#
# Vision Transformer base, patch 16x16.
# Pretrained on ImageNet-21k via HuggingFace (google/vit-base-patch16-224-in21k).
# Task A: binary (real vs AI-generated), same 1:5 class imbalance as exp 01.
#
# Key differences vs exp 01 (ResNet50 binary):
#   - ViT attention-based backbone instead of convolutional
#   - ViT normalisation: mean=0.5, std=0.5 per channel
#   - Smaller LR (transformers need lower LR to fine-tune stably)
#   - Lower dropout (ViT already has attention dropout internally)

experiment_name: "16_vit_binary"
description: "ViT-B/16 pretrained (ImageNet-21k) — binary Task A"

preprocessing:
  image_size: 224
  normalize_mean: [0.5, 0.5, 0.5]
  normalize_std: [0.5, 0.5, 0.5]

dataset:
  mode: "rgb"

model:
  architecture: "vit"
  pretrained: true
  num_classes: 2
  dropout: 0.1

training:
  num_epochs: 30
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.00001
  early_stopping_patience: 8

task: "binary"

loss:
  type: "weighted_ce"
  handle_imbalance: "weighted"   # pesos [5.0, 1.0] por ratio 1:5

augmentations:
  enabled: true
  random_resized_crop: false
  random_flip: 0.5
  rotation: 0
  color_jitter: 0.2
  brightness: 0.1
  contrast: 0.1
  saturation: 0.1
  hue: 0.0
  grayscale: 0.0
  blur: 0.0
  random_erasing: 0.0
