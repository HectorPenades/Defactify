# Experiment 17: ViT-B/16 Multiclass — pretrained (ImageNet-21k)
#
# Vision Transformer base, patch 16x16.
# Pretrained on ImageNet-21k via HuggingFace (google/vit-base-patch16-224-in21k).
# Task B: multiclass (6 generators), dataset is balanced (7000/class).
#
# Key differences vs exp 02 (ResNet50 multiclass):
#   - ViT attention-based backbone instead of convolutional
#   - ViT normalisation: mean=0.5, std=0.5 per channel
#   - Smaller LR

experiment_name: "17_vit_multiclass"
description: "ViT-B/16 pretrained (ImageNet-21k) — multiclass Task B"

preprocessing:
  image_size: 224
  normalize_mean: [0.5, 0.5, 0.5]
  normalize_std: [0.5, 0.5, 0.5]

dataset:
  mode: "rgb"

model:
  architecture: "vit"
  pretrained: true
  num_classes: 6
  dropout: 0.1

training:
  num_epochs: 30
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.00001
  early_stopping_patience: 8

task: "multiclass"

loss:
  type: "ce"
  handle_imbalance: "none"   # Task B is balanced

augmentations:
  enabled: true
  random_resized_crop: false
  random_flip: 0.5
  rotation: 0
  color_jitter: 0.2
  brightness: 0.1
  contrast: 0.1
  saturation: 0.1
  hue: 0.0
  grayscale: 0.0
  blur: 0.0
  random_erasing: 0.0
