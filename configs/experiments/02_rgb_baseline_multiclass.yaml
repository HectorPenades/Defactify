# Experiment 02: RGB Baseline Multiclass Classification

experiment_name: "02_rgb_baseline_multiclass"
description: "Baseline RGB ResNet50 for multiclass (6 AI generators)"

dataset:
  mode: "rgb"

model:
  architecture: "rgb_resnet50"
  pretrained: true
  num_classes: 6
  dropout: 0.5

training:
  num_epochs: 100
  batch_size: 32
  lr: 0.001
  weight_decay: 0.00001
  early_stopping_patience: 10

task: "multiclass"
