# Experiment 21: Weighted CE Binary — full data
#
# RQ1: ablación estrategia anti-desbalance.
# = exp 01 + loss weighted_CE(5,1). Todo lo demás idéntico a exp 01.
#
# Comparar con:
#   exp 01  — CE sin pesos        [full 1:5]  F1=0.6990
#   exp 21  — weighted_CE(5,1)    [full 1:5]  ← ESTE
#   exp 19  — focal(gamma=2)      [full 1:5]
#   exp 22  — CE                  [1:1]
#   exp 15  — weighted_CE(5,1)    [1:1]

experiment_name: "21_weighted_ce_binary"
description: "ResNet50 binary — weighted_CE(5,1) full data (RQ1)"

dataset:
  mode: "rgb"

model:
  architecture: "rgb_resnet50"
  pretrained: true
  num_classes: 2
  dropout: 0.5

training:
  num_epochs: 50
  batch_size: 32
  lr: 0.001
  weight_decay: 0.00001
  early_stopping_patience: 10

task: "binary"

loss:
  type: "weighted_ce"
  handle_imbalance: "weighted"
  class_weights: [5.0, 1.0]

augmentations:
  enabled: true
  random_resized_crop: false
  random_flip: 0.5
  rotation: 0
  color_jitter: 0.2
  brightness: 0.1
  contrast: 0.1
  saturation: 0.1
  hue: 0.0
  grayscale: 0.0
  blur: 0.0
  random_erasing: 0.0
