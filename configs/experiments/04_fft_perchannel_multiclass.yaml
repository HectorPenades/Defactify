# Experiment 04: FFT Per-Channel Multiclass Classification

experiment_name: "04_fft_perchannel_multiclass"
description: "ResNet50 on per-channel FFT magnitude spectrum - multiclass (6 generators)"

dataset:
  mode: "fft_perchannel"

model:
  architecture: "fft_resnet50"
  pretrained: true
  num_classes: 6
  dropout: 0.5

training:
  num_epochs: 50
  batch_size: 32
  lr: 0.001
  weight_decay: 0.00001
  early_stopping_patience: 10

task: "multiclass"
