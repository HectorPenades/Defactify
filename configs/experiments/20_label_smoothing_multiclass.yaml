# Experiment 20: Label Smoothing CE — Multiclass Task B
#
# Igual que exp 02 (ResNet50 multiclass pretrained) pero con Label Smoothing (eps=0.1).
#
# Label Smoothing vs CE estándar:
#   CE normal  : target = [0, 0, 1, 0, 0, 0]  (one-hot duro)
#   LS (eps=0.1): target = [0.02, 0.02, 0.90, 0.02, 0.02, 0.02]
#                 la clase correcta tiene 1-eps, el resto eps/(C-1)
#
# Qué aporta:
#   - Evita que el modelo sea excesivamente confiante (overconfidence)
#   - Penaliza las predicciones con probabilidad muy cercana a 1.0
#   - Puede mejorar calibración y generalización al test set
#
# Task B es balanceada (7000 imgs/clase) → no se necesitan pesos de clase.
#
# Comparar con:
#   exp 02  — CE estándar (baseline multiclass)
#   exp 11  — augmentaciones agresivas + CE

experiment_name: "20_label_smoothing_multiclass"
description: "ResNet50 multiclass — Label Smoothing CE (eps=0.1)"

dataset:
  mode: "rgb"

model:
  architecture: "rgb_resnet50"
  pretrained: true
  num_classes: 6
  dropout: 0.5

training:
  num_epochs: 100
  batch_size: 32
  lr: 0.001
  weight_decay: 0.00001
  early_stopping_patience: 10

task: "multiclass"

loss:
  type: "label_smoothing"
  label_smoothing: 0.1   # epsilon: 0.0 = CE normal, 0.1 = estándar, 0.2 = agresivo

augmentations:
  enabled: true
  random_resized_crop: false
  random_flip: 0.5
  rotation: 0
  color_jitter: 0.2
  brightness: 0.1
  contrast: 0.1
  saturation: 0.1
  hue: 0.0
  grayscale: 0.0
  blur: 0.0
  random_erasing: 0.0
