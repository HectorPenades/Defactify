name: defactify
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # PyTorch + CUDA
  - pytorch>=2.1
  - torchvision>=0.16
  - pytorch-cuda=11.8

  # Data processing
  - numpy=1.24
  - pandas=2.0
  - pillow=10.0

  # ML
  - scikit-learn=1.3
  - scipy=1.11

  # Visualization
  - matplotlib=3.7
  - seaborn=0.12

  # Utils
  - pyyaml=6.0
  - tqdm=4.66
  - opencv
  - click=8.1

  # Dev
  - jupyter
  - ipython
  - pytest

  # Pip
  - pip
  - pip:
      - datasets==2.14.0
      - transformers==4.35.0
      - timm==0.9.0
      - wandb==0.15.0
      - tensorboard==2.14.0